name: Feature request
description: Suggest something new
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What are you trying to do that you can't do today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would it look like?
      description: An API sketch is welcome, but not required.
      render: go

  - type: textarea
    id: alternatives
    attributes:
      label: Anything you tried instead?
      description: |
        Themes cover many layout and color changes. `RenderQuote` returns an
        `image.Image`, which can be composed further with standard Go tools.
